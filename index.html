<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="A simple, focused and ad-free app to practice English irregular verbs.">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Irregular Verbs Practice">
    <meta property="og:title" content="Irregular Verbs Practice">
    <meta property="og:description"
        content="Practice English irregular verbs with a simple, focused and ad-free web app.">
    <meta property="og:url" content="https://9re9o.github.io/learning-verbs-together-/">
    <meta property="og:image"
        content="https://9re9o.github.io/learning-verbs-together-/preview.png">
    <meta property="og:image:secure_url"
        content="https://9re9o.github.io/learning-verbs-together-/preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1734">
    <meta property="og:image:height" content="907">
    <meta property="og:image:alt"
        content="Irregular Verbs Practice app showing write, wrote and written.">
    <meta property="og:locale" content="en_US">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Irregular Verbs Practice">
    <meta name="twitter:description"
        content="Practice English irregular verbs with a simple, focused and ad-free web app.">
    <meta name="twitter:image"
        content="https://9re9o.github.io/learning-verbs-together-/preview.png">
    <meta name="twitter:image:alt"
        content="Irregular Verbs Practice app showing write, wrote and written.">

    <link rel="canonical" href="https://9re9o.github.io/learning-verbs-together-/">

    <title>Irregular Verbs Practice</title>

    <link rel="stylesheet" href="style.css">
</head>



<body>
<main class="app" aria-busy="true">

    <header class="app-header">
        <div class="header-copy">
            <h1 data-i18n="app.title">Irregular Verbs</h1>
            <p class="subtitle" data-i18n="app.subtitle">
                Practica escribiendo, no memorizando una tabla.
            </p>
        </div>

        <div class="top-controls">
            <button id="languageToggle" class="language-toggle" type="button" aria-label="Cambiar a inglés">
                EN
            </button>
            <button id="themeToggle" class="theme-toggle" type="button" aria-label="Activar tema claro">
                ☀️
            </button>
        </div>
    </header>

    <!-- MODO -->
    <section class="mode-selector">

        <p data-i18n="practice.type">Tipo de práctica</p>

        <div class="mode-buttons">

            <button id="completeMode" class="mode-btn active" data-mode="complete" data-i18n="practice.complete" aria-pressed="true">
                Completar
            </button>

            <button id="identifyMode" class="mode-btn" data-mode="identify" data-i18n="practice.identify" aria-pressed="false">
                Identificar forma
            </button>

            <button id="selectMode" class="mode-btn" data-mode="select" data-i18n="practice.select" aria-pressed="false">
                Seleccionar forma
            </button>

        </div>

    </section>

    <hr>


    <!-- GRUPO DE ESTUDIO -->
    <p class="subtitle" data-i18n="groups.title">Grupo de verbos</p>
    <section class="groups">

        <button class="group-btn" data-group="review" data-i18n="groups.review" aria-pressed="false">
            Primer grupo
        </button>

        <button class="group-btn active" data-group="current" data-i18n="groups.current" aria-pressed="true">
            Segundo grupo
        </button>

        <button class="group-btn" data-group="future" data-i18n="groups.future" aria-pressed="false">
            Último grupo
        </button>

        <button class="group-btn" data-group="all" data-i18n="groups.all" aria-pressed="false">
            Todos
        </button>

    </section>


    <!-- TARJETA -->
    <section class="card">

        <div class="top-card">

            <span id="modeLabel" class="mode">
                —
            </span>

            <span id="counter">
                0
            </span>

        </div>


        <p id="questionText" class="question-text">
            …
        </p>


        <div class="verb-container">

            <h2 id="verbWord">
                …
            </h2>

            <button id="speakQuestion" class="speak-button" data-i18n-aria-label="buttons.listenPronunciation" aria-label="Escuchar pronunciación">
                🔊
            </button>

        </div>

        <p id="phonetic" class="phonetic">
        </p>




        <input type="text" id="answer" placeholder="Escribe tu respuesta..." data-i18n-placeholder="answer.placeholder" autocomplete="off" autocapitalize="none"
            spellcheck="false">

        <div id="formOptions" class="form-options hidden">

            <button data-form="infinitive" class="form-option" data-i18n="forms.infinitive">
                Infinitive
            </button>

            <button data-form="past" class="form-option" data-i18n="forms.past">
                Past Simple
            </button>

            <button data-form="participle" class="form-option" data-i18n="forms.participle">
                Past Participle
            </button>

        </div>

        <button id="checkButton" data-i18n="buttons.check" class="main-button">
            Comprobar
        </button>


        <div id="result" class="result" role="status" aria-live="polite"></div>


        <button id="nextButton" data-i18n="buttons.next" class="secondary-button">
            Siguiente verbo →
        </button>

    </section>

    <button id="showVerbList" data-i18n="buttons.list" class="list-button" aria-expanded="false" aria-controls="verbListSection">
        📚 Ver lista completa
    </button>


    <section id="verbListSection" class="verb-list-section hidden" aria-labelledby="verbListTitle">

        <div class="list-header">

            <div>
                <p class="small-title" data-i18n="list.eyebrow">
                    IRREGULAR VERBS
                </p>

                <h3 id="verbListTitle" data-i18n="list.title">
                    Lista completa
                </h3>
            </div>


            <button id="closeVerbList" class="close-button" data-i18n-aria-label="buttons.close" aria-label="Cerrar">
                ✕
            </button>

        </div>


        <div class="table-container">

            <table aria-labelledby="verbListTitle">

                <thead>

                    <tr>
                        <th data-i18n="forms.infinitive">Infinitive</th>
                        <th data-i18n="forms.past">Past Simple</th>
                        <th data-i18n="forms.participle">Past Participle</th>
                        <th data-i18n="list.translation">Español</th>
                    </tr>

                </thead>


                <tbody id="verbTableBody">

                    <!-- JavaScript agrega los verbos -->

                </tbody>

            </table>

        </div>
        <!-- =========================
     MODAL DETALLE DEL VERBO
========================= -->

        <div id="verbModal" class="verb-modal hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalVerbTitle">

            <div class="verb-modal-content">

                <button id="closeVerbModal" class="modal-close" data-i18n-aria-label="buttons.close" aria-label="Cerrar">
                    ✕
                </button>


                <p class="modal-small-title" data-i18n="modal.eyebrow">
                    IRREGULAR VERB
                </p>


                <h3 id="modalVerbTitle">
                </h3>


                <p id="modalTranslation" class="modal-translation">
                </p>


                <!-- INFINITIVE -->

                <div class="modal-form">

                    <div class="modal-form-header" data-i18n="forms.infinitive">
                        INFINITIVE
                    </div>

                    <div class="modal-form-content">

                        <div>

                            <strong id="modalInfinitive">
                            </strong>

                            <span id="modalIpaInfinitive">
                            </span>

                        </div>


                        <button id="speakInfinitive" class="modal-speak" data-i18n-aria-label="buttons.listen" aria-label="Escuchar">
                            🔊
                        </button>

                    </div>

                </div>


                <!-- PAST SIMPLE -->

                <div class="modal-form">

                    <div class="modal-form-header" data-i18n="forms.past">
                        PAST SIMPLE
                    </div>

                    <div class="modal-form-content">

                        <div>

                            <strong id="modalPast">
                            </strong>

                            <span id="modalIpaPast">
                            </span>

                        </div>


                        <button id="speakPast" class="modal-speak" data-i18n-aria-label="buttons.listen" aria-label="Escuchar">
                            🔊
                        </button>

                    </div>

                </div>


                <!-- PAST PARTICIPLE -->

                <div class="modal-form">

                    <div class="modal-form-header" data-i18n="forms.participle">
                        PAST PARTICIPLE
                    </div>

                    <div class="modal-form-content">

                        <div>

                            <strong id="modalParticiple">
                            </strong>

                            <span id="modalIpaParticiple">
                            </span>

                        </div>


                        <button id="speakParticiple" class="modal-speak" data-i18n-aria-label="buttons.listen" aria-label="Escuchar">
                            🔊
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>



</main>
<script src="verbs.js"></script>

<script src="app.js"></script>

</body>


</html>
